<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆翻牌小游戏</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* 页面基础布局，复用首页的深色背景 */
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* 顶部信息栏 */
        .game-header {
            text-align: center;
            padding: 20px;
        }
        .stats {
            font-size: 1.2rem;
            margin: 15px 0;
            color: #38bdf8;
            font-weight: bold;
        }
        .stats span {
            margin: 0 15px;
        }
        
        /* 控制按钮 */
        .btn {
            padding: 10px 25px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0ea5e9;
            transform: scale(1.05);
        }

        /* 游戏主体网格 */
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4列 */
            gap: 15px;
            max-width: 500px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* 卡片容器（负责3D效果） */
        .card {
            aspect-ratio: 1 / 1; /* 保持正方形 */
            perspective: 1000px; /* 3D透视深度 */
            cursor: pointer;
        }

        /* 卡片内部（用来翻转） */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d; /* 保留3D空间 */
        }

        /* 被翻开时的状态 */
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* 卡片的正反面公共样式 */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* 隐藏背面 */
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem; /* 表情符号大小 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 卡片背面（默认朝上，带问号） */
        .card-back {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border: 2px solid #38bdf8;
            color: #38bdf8;
            font-size: 2rem;
        }

        /* 卡片正面（印着图案，默认翻转到背面） */
        .card-front {
            background-color: #0f172a;
            border: 2px solid #94a3b8;
            transform: rotateY(180deg); /* 初始就翻转180度藏起来 */
        }

        /* 匹配成功后的高亮效果 */
        .card.matched .card-front {
            border-color: #10b981; /* 变成绿色边框 */
            box-shadow: 0 0 15px #10b981;
        }

        /* 手机端适配 */
        @media (max-width: 500px) {
            #game-board {
                grid-template-columns: repeat(3, 1fr); /* 手机端变3列 */
                gap: 10px;
            }
            .card-front, .card-back {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="logo">记忆翻牌</div>
        <ul class="nav-links">
            <li><a href="index.html">返回首页</a></li>
        </ul>
    </nav>

    <div class="game-header">
        <h2>寻找相同的图案</h2>
        <div class="stats">
            <span>步数: <span id="moves">0</span></span>
            <span>配对: <span id="matches">0</span> / 8</span>
        </div>
        <button class="btn" id="restart-btn">重新开始</button>
    </div>

    <!-- 游戏区域 -->
    <div id="game-board"></div>
    <script>

           // 8个角色的图片完整链接
        const imgPaths = [
            "https://raw.githubusercontent.com/Cha1ld3/Cha1ld/main/jiushen.png",
            "https://raw.githubusercontent.com/Cha1ld3/Cha1ld/main/yinhui.png",
            "https://raw.githubusercontent.com/Cha1ld3/Cha1ld/main/chizui.png",
            "https://raw.githubusercontent.com/Cha1ld3/Cha1ld/main/hwlpld.png",
            "https://raw.githubusercontent.com/Cha1ld3/Cha1ld/main/sikadi.png",
            "https://raw.githubusercontent.com/Cha1ld3/Cha1ld/main/jmdkss.png",
            "https://raw.githubusercontent.com/Cha1ld3/Cha1ld/main/chuxue.png",
            "https://raw.githubusercontent.com/Cha1ld3/Cha1ld/main/biexiao.png"
        ];

        // 把链接转换成图片标签，占满整个卡片，保证不变形
        const icons = imgPaths.map(link => `<img src="${link}" alt="加载中..." style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">`);
        // 取前8个，然后复制一份，变成16张牌，最后打乱顺序
        const gameCards = [...icons.slice(0, 8), ...icons.slice(0, 8)].sort(() => Math.random() - 0.5);

        const gameBoard = document.getElementById('game-board');
        const movesText = document.getElementById('moves');
        const matchesText = document.getElementById('matches');
        const restartBtn = document.getElementById('restart-btn');

        let firstCard = null;
        let secondCard = null;
        let lockBoard = false; // 防止狂点导致bug
        let moves = 0;
        let matches = 0;

        // 初始化游戏
        function initGame() {
            gameBoard.innerHTML = '';
            moves = 0;
            matches = 0;
            firstCard = null;
            secondCard = null;
            lockBoard = false;
            movesText.innerText = moves;
            matchesText.innerText = matches;

            // 重新打乱数组
            const shuffledCards = [...icons.slice(0, 8), ...icons.slice(0, 8)].sort(() => Math.random() - 0.5);

            // 动态生成卡片
            shuffledCards.forEach(icon => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.icon = icon; // 把图案存在 dataset 里
                
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">?</div>
                        <div class="card-front">${icon}</div>
                    </div>
                `;
                
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        // 翻牌逻辑
        function flipCard() {
            if (lockBoard) return; // 如果正在处理，不让点
            if (this === firstCard) return; // 如果点的是同一张牌，无视
            if (this.classList.contains('matched')) return; // 如果已经配对成功，无视

            this.classList.add('flipped');

            if (!firstCard) {
                // 第一次翻牌
                firstCard = this;
                return;
            }

            // 第二次翻牌
            secondCard = this;
            moves++;
            movesText.innerText = moves;
            
            checkForMatch();
        }

        // 检查两张牌是否一样
        function checkForMatch() {
            let isMatch = firstCard.dataset.icon === secondCard.dataset.icon;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        // 配对成功
        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            // 移除点击事件，不能再翻
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);

            matches++;
            matchesText.innerText = matches;

            resetBoard();

            // 如果8对全找到了，弹窗提示
            if (matches === 8) {
                setTimeout(() => {
                    alert(`太棒了！你用了 ${moves} 步完成了游戏！`);
                }, 500);
            }
        }

        // 配对失败，翻回去
        function unflipCards() {
            lockBoard = true; // 锁定面板
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000); // 1秒后翻回去
        }

        // 重置当前翻牌状态
        function resetBoard() {
            firstCard = null;
            secondCard = null;
            lockBoard = false;
        }

        // 点击重新开始按钮
        restartBtn.addEventListener('click', initGame);

        // 页面加载时启动游戏
        initGame();
        </script>
    </script>
</body>
</html>
