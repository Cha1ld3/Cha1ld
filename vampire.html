<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸存者原型</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* 隐藏滚动条 */
            background-color: #111;
            font-family: sans-serif;
            color: white;
        }
        canvas {
            display: block;
        }
        /* 游戏UI界面 */
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            pointer-events: none; /* 让鼠标穿透UI，不影响操作 */
            text-shadow: 2px 2px 2px #000;
        }
            
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none; /* 默认隐藏 */
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #38bdf8;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
               /* 右上角返回主页按钮 */
        #back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999; /* 保证按钮永远在最上层 */
            padding: 10px 20px;
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 15px #38bdf8;
            transition: all 0.3s ease;
        }

        /* 鼠标悬停时的效果 */
        #back-btn:hover {
            background-color: #0ea5e9;
            transform: scale(1.05);
        }
                /* 升级弹窗样式 */
        #level-up-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none; /* 默认隐藏 */
            z-index: 2000;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
        }
        .upgrade-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .upgrade-options button {
            padding: 15px;
            font-size: 16px;
            background-color: #1e293b;
            color: #38bdf8;
            border: 2px solid #38bdf8;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upgrade-options button:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

        <div id="ui">
        <div>时间: <span id="time">0</span>s</div>
        <div>击杀: <span id="kills">0</span></div>
        <div>等级: <span id="level">1</span></div>
        <!-- 新增：血量显示 -->
        <div>血量: <span id="hp">100</span></div>
    </div>

    <!-- 新增：升级选择界面 (默认隐藏) -->
    <div id="level-up-screen">
        <h2>升级！请选择一项强化</h2>
        <div class="upgrade-options">
            <button onclick="applyUpgrade(1)">增加子弹数量 (散弹)</button>
            <button onclick="applyUpgrade(2)">增加穿透 (穿透+1)</button>
            <button onclick="applyUpgrade(3)">恢复一滴血量 (+10 HP)</button>
        </div>
    </div>

    <div id="game-over">
        <h2>你被怪物淹没了！</h2>
        <p>存活时间: <span id="final-time">0</span>秒</p>
        <button onclick="location.reload()">重新开始</button>
    </div>
        <!-- 返回主页按钮 -->
    <a href="index.html" id="back-btn">← 返回主页</a>

    <canvas id="gameCanvas"></canvas>

    <script>
                const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // 游戏状态
        let isGameOver = false;
        let isPaused = false; // 暂停状态（选技能时用）
        let time = 0;
        let kills = 0;
        let level = 1;
        let exp = 0;

        // 升级属性
        let bulletCount = 1;   // 子弹数量
        let bulletSpread = 0;  // 散布角度
        let bulletPierce = 0;  // 穿透数量

        // 玩家设定 (速度减半)
        const player = {
            x: width / 2,
            y: height / 2,
            radius: 15,
            speed: 2, // 原本是4，改成2
            color: '#38bdf8',
            hp: 100,
            maxHp: 100
        };

        // 敌人数组
        let enemies = [];
        let bullets = [];
        let orbs = [];

        // 键盘控制
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
        });

        // 手机触屏控制
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        canvas.addEventListener('touchmove', (e) => {
            let touchX = e.touches[0].clientX;
            let touchY = e.touches[0].clientY;
            let dx = touchX - touchStartX;
            let dy = touchY - touchStartY;
            touchStartX = touchX;
            touchStartY = touchY;
            if (dx > 5) player.x += player.speed;
            if (dx < -5) player.x -= player.speed;
            if (dy > 5) player.y += player.speed;
            if (dy < -5) player.y -= player.speed;
        });

        // 动态刷怪逻辑：随等级增加
        function spawnEnemy() {
            if (isGameOver || isPaused) return;
            
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? 0 : width;
                y = Math.random() * height;
            } else {
                x = Math.random() * width;
                y = Math.random() < 0.5 ? 0 : height;
            }

                enemies.push({
                x: x,
                y: y,
                radius: 15,
                // 玩家速度是 2，这里初始设为 1.2，随等级微调，但最高封顶在 1.9
                speed: Math.min(1.9, 1.2 + (level * 0.05)), 
                color: '#ef4444',
                hp: 1
            });
        }

        // 自动攻击
        setInterval(() => {
            if (isGameOver || isPaused) return;
            
            // 找最近的怪
            let closestEnemy = null;
            let minDist = Infinity;
            enemies.forEach(enemy => {
                let dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (dist < minDist) { minDist = dist; closestEnemy = enemy; }
            });

            if (closestEnemy) {
                let baseAngle = Math.atan2(closestEnemy.y - player.y, closestEnemy.x - player.x);
                
                                // 根据子弹数量计算散射
                for (let i = 0; i < bulletCount; i++) {
                    // 直接根据偏移量计算最终角度
                    let angleOffset = (i - (bulletCount - 1) / 2) * bulletSpread;
                    let finalAngle = baseAngle + angleOffset;
                    
                    bullets.push({
                        x: player.x,
                        y: player.y,
                        radius: 5,
                        speed: 7,
                        vx: Math.cos(finalAngle) * 7,
                        vy: Math.sin(finalAngle) * 7,
                        color: '#fde047',
                        pierce: bulletPierce, // 记录穿透次数
                        hitEnemies: [] // 记录已经打过的怪，防止重复扣血
                    });
                }
            }
        }, 600);

        // 游戏主循环
        function update() {
            if (isGameOver || isPaused) return;

            // 玩家移动
            if (keys.w && player.y > player.radius) player.y -= player.speed;
            if (keys.s && player.y < height - player.radius) player.y += player.speed;
            if (keys.a && player.x > player.radius) player.x -= player.speed;
            if (keys.d && player.x < width - player.radius) player.x += player.speed;

            // 子弹移动与碰撞
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    // 如果这颗子弹已经打过这个怪，就跳过
                    if (b.hitEnemies.includes(e)) continue; 

                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + b.radius) {
                        b.hitEnemies.push(e); // 记录打中
                        
                        if (b.pierce > 0) {
                            b.pierce--; // 穿透减1，子弹继续飞
                        } else {
                            bullets.splice(i, 1); // 没穿透了，子弹消失
                        }
                        
                        enemies.splice(j, 1); // 怪死
                        kills++;
                        document.getElementById('kills').innerText = kills;
                        
                        // 掉落经验
                        orbs.push({ x: e.x, y: e.y, radius: 5 });
                        
                        if (b.pierce <= 0) break; // 子弹没了就跳出循环
                    }
                }
            }

                        // 怪物追踪与碰撞分离
            for (let i = 0; i < enemies.length; i++) {
                let e = enemies[i];
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let dist = Math.hypot(dx, dy);
                
                // 1. 怪物追踪玩家
                if (dist > 0) {
                    e.x += (dx / dist) * e.speed;
                    e.y += (dy / dist) * e.speed;
                }

                // 2. 怪物碰到玩家扣血
                if (dist < player.radius + e.radius) {
                    player.hp -= 10;
                    document.getElementById('hp').innerText = Math.max(0, player.hp);
                    // 用 splice 需要注意索引，因为我们在正向循环，所以标记移除
                    enemies.splice(i, 1);
                    i--; // 修正数组长度变化导致的索引错位
                    if (player.hp <= 0) { gameOver(); return; }
                    continue; // 这个怪已经死了，不需要算碰撞体积了
                }

                // 3. 怪物与怪物之间的碰撞体积（防止重叠）
                for (let j = i + 1; j < enemies.length; j++) {
                    let e2 = enemies[j];
                    let edx = e2.x - e.x;
                    let edy = e2.y - e.y;
                    let edist = Math.hypot(edx, edy);
                    
                    // 如果两个怪物撞在一起了
                    if (edist < e.radius + e2.radius) {
                        // 计算重叠深度
                        let overlap = (e.radius + e2.radius) - edist;
                        
                        // 防止除以0
                        if (edist === 0) edist = 0.1; 
                        
                        // 把它们互相推开（各推一半的距离）
                        let pushX = (edx / edist) * (overlap / 2);
                        let pushY = (edy / edist) * (overlap / 2);
                        
                        e.x -= pushX;
                        e.y -= pushY;
                        e2.x += pushX;
                        e2.y += pushY;
                    }
                }
            }
            // 经验球拾取
            for (let i = orbs.length - 1; i >= 0; i--) {
                let orb = orbs[i];
                let dx = player.x - orb.x;
                let dy = player.y - orb.y;
                let dist = Math.hypot(dx, dy);

                if (dist < 100) {
                    orb.x += (dx / dist) * 5;
                    orb.y += (dy / dist) * 5;
                }

                if (dist < player.radius + orb.radius) {
                    orbs.splice(i, 1);
                    exp++;
                    if (exp >= level * 5) {
                        levelUp();
                    }
                }
            }
        }

        // 渲染
        function draw() {
            ctx.clearRect(0, 0, width, height);

            orbs.forEach(orb => {
                ctx.beginPath();
                ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#10b981'; ctx.fill();
            });

            enemies.forEach(e => {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = e.color; ctx.fill();
            });

            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color; ctx.fill();
            });

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color; ctx.fill();
        }

        // 升级逻辑
        function levelUp() {
            level++;
            exp = 0;
            document.getElementById('level').innerText = level;
            
            // 暂停游戏并显示弹窗
            isPaused = true;
            document.getElementById('level-up-screen').style.display = 'block';
        }

        // 应用升级选项
        function applyUpgrade(choice) {
                        if (choice === 1) {
                bulletCount++;
                bulletSpread += 0.15; 
                
                // 核心限制：最大散布 90 度
                // 90度等于 PI/2 弧度。如果超过这个值，就强制让它等于 1.57
                if (bulletSpread > Math.PI / 2) {
                    bulletSpread = Math.PI / 2;
                }
            } else if (choice === 2) {
                bulletPierce += 1;
            } else if (choice === 3) {
                player.hp += 10;
                document.getElementById('hp').innerText = player.hp;
            }
            
            // 关闭弹窗，恢复游戏
            document.getElementById('level-up-screen').style.display = 'none';
            isPaused = false;
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('final-time').innerText = time;
            document.getElementById('game-over').style.display = 'block';
        }

        // 计时与动态刷怪
        setInterval(() => {
            if (!isGameOver && !isPaused) {
                time++;
                document.getElementById('time').innerText = time;
                
                // 刷新数量 = 等级数
                for (let i = 0; i < level; i++) {
                    spawnEnemy();
                }
            }
        }, 1000);

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
